name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: >-
          xcodebuild -project 'Hidden Bar.xcodeproj' -scheme 'Hidden Bar'
          -configuration Debug-Direct -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO test
